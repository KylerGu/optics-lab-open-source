services:
  - type: web
    name: optics-lab
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Public site: no debug logs, no /docs, security headers on.
      # Leave this unset for local `npm run dev`.
      - key: APP_ENV
        value: production
      # Public site: do not serve visitors with the operator key.
      - key: AI_ALLOW_SERVER_KEY
        value: "0"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_REASONING_EFFORT
        value: high
