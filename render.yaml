services:
  - type: web
    name: optics-lab
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_REASONING_EFFORT
        value: high
